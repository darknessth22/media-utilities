name: Build Android APK

on:
  push:
    branches: [mobile-android]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter version info
        working-directory: mobile
        run: flutter --version

      - name: Pub get
        working-directory: mobile
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: mobile
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        working-directory: mobile
        run: dart run flutter_native_splash:create

      - name: Build release APK (arm64-v8a)
        working-directory: mobile
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK
        run: |
          mkdir -p out
          cp mobile/build/app/outputs/flutter-apk/app-release.apk out/videl-android-arm64-v8a.apk
          ls -lh out/

      - name: Publish rolling release
        uses: ncipollo/release-action@v1
        with:
          tag: android-latest
          name: Videl Android (Latest)
          body: |
            **Videl Android — arm64-v8a sideload build**

            Auto-built from `mobile-android` branch · commit `${{ github.sha }}`.

            ## Install
            1. Download `videl-android-arm64-v8a.apk` below
            2. On phone: Settings → Apps → Install unknown apps → allow your file manager / browser
            3. Open the APK → tap **Install**

            Requires Android 10+ (API 29). ARM64 only.
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: false
          artifacts: out/videl-android-arm64-v8a.apk
          token: ${{ secrets.GITHUB_TOKEN }}
