name: Build Android APK

on:
  # Android APK builds on version tags too — one tag = one APK, attached to the
  # same release as the Windows/Linux assets.
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Flutter version info
        working-directory: mobile
        run: flutter --version

      - name: Pub get
        working-directory: mobile
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: mobile
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        working-directory: mobile
        run: dart run flutter_native_splash:create

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/videl-release.jks
            echo "KEYSTORE_PATH=/tmp/videl-release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "Keystore decoded."
          else
            echo "No KEYSTORE_BASE64 secret — will fall back to debug signing."
          fi

      - name: Build release APK (arm64-v8a)
        working-directory: mobile
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK
        run: |
          mkdir -p out
          cp mobile/build/app/outputs/flutter-apk/app-release.apk out/videl-android-arm64-v8a.apk
          ls -lh out/

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          # Tag build → attach the APK to that version's release (alongside the
          # Windows/Linux assets from build.yml). Branch build → rolling latest.
          tag: ${{ github.ref_type == 'tag' && github.ref_name || 'android-latest' }}
          name: ${{ github.ref_type == 'tag' && format('Videl {0}', github.ref_name) || 'Videl Android (Latest)' }}
          body: |
            **Videl Android — arm64-v8a sideload build**

            Auto-built from `mobile-android` branch · commit `${{ github.sha }}`.

            ## Install
            1. Download `videl-android-arm64-v8a.apk` below
            2. On phone: Settings → Apps → Install unknown apps → allow your file manager / browser
            3. Open the APK → tap **Install**

            Requires Android 10+ (API 29). ARM64 only.
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: false
          artifacts: out/videl-android-arm64-v8a.apk
          token: ${{ secrets.GITHUB_TOKEN }}
