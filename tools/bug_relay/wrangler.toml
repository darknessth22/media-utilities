name = "videl-bug-relay"
main = "worker.js"
compatibility_date = "2025-06-01"
account_id = "20f3a38fbdebfcdda8f82c766faf6ce8"
workers_dev = true

# 5 reports per minute per IP.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Cloudflare Email Service. Locked to the support inbox, which must be a verified
# Email Routing destination address (free on every plan, no quota). The From
# domain, videl.app, has Email Routing enabled.
[[send_email]]
name = "EMAIL"
destination_address = "videl.support@gmail.com"
