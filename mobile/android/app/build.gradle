plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

apply plugin: "com.chaquo.python"

android {
    namespace = "com.videl.mobile"
    compileSdk = 35
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            def ksFile = System.getenv("KEYSTORE_PATH")
            def ksPass = System.getenv("KEYSTORE_PASSWORD")
            def kPass  = System.getenv("KEY_PASSWORD")
            if (ksFile && new File(ksFile).exists()) {
                storeFile     file(ksFile)
                storePassword ksPass
                keyAlias      "videl"
                keyPassword   kPass ?: ksPass
            } else {
                // fallback to debug signing for local dev builds
                storeFile     signingConfigs.debug.storeFile
                storePassword signingConfigs.debug.storePassword
                keyAlias      signingConfigs.debug.keyAlias
                keyPassword   signingConfigs.debug.keyPassword
            }
        }
    }

    defaultConfig {
        applicationId = "com.videl.mobile"
        minSdk = 29
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    packagingOptions {
        jniLibs {
            excludes += ["**/x86/**", "**/x86_64/**", "**/armeabi-v7a/**"]
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}

chaquopy {
    defaultConfig {
        version = "3.11"
        pip {
            // Nightly master — Facebook/IG/TikTok extractors lag in stable releases.
            install "https://github.com/yt-dlp/yt-dlp/archive/refs/heads/master.tar.gz"
        }
    }
}
