<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // GitHub Pages serves this page for unknown addresses too; send those visitors to videl.app.
  if (location.hostname.endsWith("github.io")) location.replace("https://videl.app/");
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found | Videl</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#05070f; --text:#f1f5f9; --muted:#94a3b8; --blue:#0D6EFD; --border:#1e2d45; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
         font-family: 'Inter', system-ui, -apple-system, sans-serif; overflow-x: hidden; }
  body::before { content: ""; position: fixed; inset: -20% auto auto -20%; width: 70vw; height: 70vw; border-radius: 50%;
                 background: radial-gradient(circle, rgba(29,78,216,.35), transparent 65%); pointer-events: none; }
  main { position: relative; max-width: 520px; }
  img { height: 44px; display: block; margin-bottom: 40px; }
  .code { font-size: 14px; font-weight: 600; color: var(--muted); }
  h1 { margin-top: 10px; font-size: clamp(2rem, 6vw, 3rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  p { margin-top: 16px; color: var(--muted); line-height: 1.6; font-size: 17px; }
  .actions { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; }
  a.btn { display: inline-flex; align-items: center; min-height: 46px; padding: 0 22px; border-radius: 999px; font-weight: 600;
          text-decoration: none; color: var(--text); border: 1px solid var(--border); transition: border-color .2s, background .2s; }
  a.btn:hover { border-color: #2a3f5f; }
  a.primary { background: var(--blue); border-color: var(--blue); }
  a.primary:hover { background: #3b82f6; border-color: #3b82f6; }
  a:focus-visible { outline: 2px solid #9DBBFF; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <a href="/" aria-label="Videl home"><img src="/assets/videl_logo.png" alt="Videl"></a>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>There's nothing at this address on videl.app. The link may have a typo, or the page may have moved.</p>
  <div class="actions">
    <a class="btn primary" href="/">Go to the download page</a>
    <a class="btn" href="https://app.videl.app/">Open the web app</a>
  </div>
</main>
</body>
</html>
