name: videl_mobile
description: Videl Mobile — Android sideload build of the Videl media toolkit.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  uuid: ^4.4.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  ffmpeg_kit_flutter_new: ^3.2.0
  file_picker: ^8.0.3
  image: ^4.2.0
  sqflite: ^2.3.3
  video_player: ^2.9.1
  flutter_colorpicker: ^1.1.0
  shared_preferences: ^2.2.3
  path: ^1.9.0

dev_dependencies:
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
  flutter_test:
    sdk: flutter

flutter_native_splash:
  color: "#0A1020"
  image: "assets/videl_icon.png"
  android_12:
    color: "#0A1020"
    image: "assets/videl_icon.png"
  android: true
  ios: false

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/videl_icon.png"
  adaptive_icon_background: "#060C1A"
  adaptive_icon_foreground: "assets/videl_icon.png"
  min_sdk_android: 29

flutter:
  uses-material-design: true
  assets:
    - assets/videl_icon.png
    - assets/videl_logo.png
