name: Build Videl

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Embed SendGrid API key
        shell: pwsh
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python - <<'EOF'
          import os, pathlib
          key = os.environ.get("SENDGRID_API_KEY", "")
          f = pathlib.Path("gui/tabs/bug_reporter.py")
          text = f.read_text(encoding="utf-8")
          if key:
              text = text.replace("@@SENDGRID_API_KEY@@", key)
          else:
              print("Warning: SENDGRID_API_KEY secret not set")
          f.write_text(text, encoding="utf-8")
          EOF

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Build executable and installer
        run: python build_executable.py

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: Videl-Setup-${{ github.sha }}
          path: Output/Videl_Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload size report
        uses: actions/upload-artifact@v5
        with:
          name: size-report-${{ github.sha }}
          path: dist/size-report.json
          if-no-files-found: warn
          retention-days: 7
