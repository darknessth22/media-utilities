name: Build Videl

on:
  # Release artifacts only build on version tags — one tag = one Win+Linux build.
  # android-* tags trigger only the Android workflow, not this one.
  push:
    tags:
      - 'v*'
      - '!android-*'
  workflow_dispatch:

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    if: ${{ github.ref != 'refs/heads/001-linux-build' && !contains(github.event.head_commit.message, '[skip-windows]') }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path core/version.py -Pattern 'VERSION\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Detected version: $v"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-build.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache ffmpeg binaries
        uses: actions/cache@v5
        with:
          path: bin
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('build_config.json') }}

      - name: Install build-only Python dependencies
        run: pip install -r requirements-build.txt

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Build (clean venv)
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: python build_executable.py

      - name: Snapshot clean build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/clean | Out-Null
          Copy-Item Output/Videl_Setup.exe artifacts/clean/Videl_Setup.exe
          Copy-Item dist/size-report.json artifacts/clean/size-report.json
          # Capture path-set for parity comparison
          Get-ChildItem -Recurse -File dist/Videl |
            ForEach-Object { $_.FullName.Substring((Resolve-Path dist/Videl).Path.Length + 1) } |
            Sort-Object | Out-File -Encoding utf8 artifacts/clean/paths.txt

      - name: Generate delta-update file manifest
        env:
          VIDEL_PRIV_KEY_PEM: ${{ secrets.VIDEL_PRIV_KEY_PEM }}
        shell: pwsh
        run: |
          if (-not $env:VIDEL_PRIV_KEY_PEM) {
            Write-Error "Missing secret VIDEL_PRIV_KEY_PEM — required to sign the delta manifest."
            exit 1
          }
          python tools/gen_manifest.py dist/Videl `
            --version "${{ steps.version.outputs.version }}" `
            --priv-key "$env:VIDEL_PRIV_KEY_PEM" `
            --out artifacts/clean/videl-files.manifest.json

      - name: Upload delta-update blobs
        env:
          # Prefer a PAT (5000 req/hour) so the first full blob seed completes
          # in one run; fall back to GITHUB_TOKEN (~1000/hour — the uploader
          # then seeds incrementally across releases without failing the build).
          GH_TOKEN: ${{ secrets.VIDEL_BLOB_PAT || secrets.GITHUB_TOKEN }}
        run: python tools/upload_blobs.py dist/Videl --repo ${{ github.repository }}

      - name: Pollute venv with AI packages (parity check)
        run: |
          pip install rembg demucs torch onnxruntime --quiet

      - name: Build (polluted venv)
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: python build_executable.py

      - name: Compare clean vs polluted (SC-002)
        shell: pwsh
        run: |
          $polluted = Get-ChildItem -Recurse -File dist/Videl |
            ForEach-Object { $_.FullName.Substring((Resolve-Path dist/Videl).Path.Length + 1) } |
            Sort-Object
          $polluted | Out-File -Encoding utf8 artifacts/polluted-paths.txt
          $diff = Compare-Object (Get-Content artifacts/clean/paths.txt) $polluted
          if ($diff) {
            Write-Error "Path-set divergence between clean and polluted builds:"
            $diff | Format-Table | Out-String | Write-Error
            exit 1
          }
          $cleanReport = Get-Content artifacts/clean/size-report.json | ConvertFrom-Json
          $pollutedReport = Get-Content dist/size-report.json | ConvertFrom-Json
          $cleanSize = (Get-Item artifacts/clean/Videl_Setup.exe).Length
          $pollutedSize = (Get-Item Output/Videl_Setup.exe).Length
          $delta = [math]::Abs($pollutedSize - $cleanSize) / $cleanSize
          Write-Host ("Installer size delta: {0:P2} (clean={1} bytes, polluted={2} bytes)" -f $delta, $cleanSize, $pollutedSize)
          if ($delta -gt 0.05) {
            Write-Error "Installer size delta exceeds 5% tolerance (SC-002)"
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: Videl-Setup-${{ github.sha }}
          path: artifacts/clean/Videl_Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload size report
        uses: actions/upload-artifact@v5
        with:
          name: size-report-${{ github.sha }}
          path: artifacts/clean/size-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Sign installer (Ed25519 manifest)
        env:
          VIDEL_PRIV_KEY_PEM: ${{ secrets.VIDEL_PRIV_KEY_PEM }}
        shell: pwsh
        run: |
          if (-not $env:VIDEL_PRIV_KEY_PEM) {
            Write-Error "Missing secret VIDEL_PRIV_KEY_PEM — set it to the Ed25519 PEM that matches core/_signing.py PUBLIC_KEY_B64."
            exit 1
          }
          python tools/sign_installer.py artifacts/clean/Videl_Setup.exe `
            --version "${{ steps.version.outputs.version }}" `
            --priv-key "$env:VIDEL_PRIV_KEY_PEM" `
            --out artifacts/clean/Videl_Setup.exe.sig.json

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Videl {0}', github.ref_name) || format('Videl v{0}', steps.version.outputs.version) }}
          prerelease: false
          # append_body preserves any body already written by another workflow
          # (e.g. Android) so concurrent jobs don't overwrite each other.
          append_body: true
          body: |
            **Windows:** `Videl_Setup.exe` · `Videl_Setup.exe.sig.json`
          files: |
            artifacts/clean/Videl_Setup.exe
            artifacts/clean/Videl_Setup.exe.sig.json
            artifacts/clean/videl-files.manifest.json
          fail_on_unmatched_files: true

  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-build.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache ffmpeg binaries
        uses: actions/cache@v5
        with:
          path: bin
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('build_config.json') }}

      - name: Install system deps (libfuse2 + Qt6 + xcb for linuxdeploy-qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 file desktop-file-utils \
            qmake6 qt6-base-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 libpulse0

      - name: Install build-only Python dependencies
        run: pip install -r requirements-build.txt

      - name: Install AppImage tooling
        run: |
          mkdir -p tools
          curl -fsSL -o tools/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o tools/linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          curl -fsSL -o tools/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x tools/linuxdeploy-x86_64.AppImage tools/linuxdeploy-plugin-qt-x86_64.AppImage tools/appimagetool-x86_64.AppImage

      - name: Build AppImage
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: bash build_appimage.sh

      - name: Read app version
        id: version
        run: |
          v=$(python -c "import re,pathlib;print(re.search(r'VERSION\s*=\s*\"([^\"]+)\"', pathlib.Path('core/version.py').read_text()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Detected version: $v"

      - name: Sign AppImage (Ed25519 manifest)
        env:
          VIDEL_PRIV_KEY_PEM: ${{ secrets.VIDEL_PRIV_KEY_PEM }}
        run: |
          if [ -z "${VIDEL_PRIV_KEY_PEM:-}" ]; then
            echo "Missing secret VIDEL_PRIV_KEY_PEM — set it to the Ed25519 PEM that matches core/_signing.py PUBLIC_KEY_B64." >&2
            exit 1
          fi
          python tools/sign_installer.py dist/Videl-x86_64.AppImage \
            --version "${{ steps.version.outputs.version }}" \
            --priv-key "$VIDEL_PRIV_KEY_PEM" \
            --out dist/Videl-x86_64.AppImage.sig.json

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v5
        with:
          name: Videl-AppImage-${{ github.sha }}
          path: dist/Videl-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Videl {0}', github.ref_name) || format('Videl v{0}', steps.version.outputs.version) }}
          prerelease: false
          append_body: true
          body: |
            **Linux:** `Videl-x86_64.AppImage` · `Videl-x86_64.AppImage.sig.json`
          files: |
            dist/Videl-x86_64.AppImage
            dist/Videl-x86_64.AppImage.sig.json
          fail_on_unmatched_files: true
