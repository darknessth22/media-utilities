name: Build Android APK

on:
  # v* tags: build alongside Windows/Linux in a full release.
  # android-* tags: mobile-only build without triggering build.yml, never
  # marked latest (see makeLatest below). Bump mobile/pubspec.yaml and
  # kAppVersion to the tag's version first.
  push:
    tags:
      - 'v*'
      - 'android-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pro on Android lives in the private videl-pro repo (videl_pro/mobile).
      # The public app builds against mobile/pro_stub; this override swaps in
      # the real package. Official builds must include it, so a missing token
      # fails the release, as on the desktop.
      - name: Checkout Pro module
        uses: actions/checkout@v4
        with:
          repository: darknessth22/videl-pro
          token: ${{ secrets.VIDEL_PRO_TOKEN }}
          path: videl_pro

      - name: Use the Pro package
        working-directory: mobile
        run: |
          test -f ../videl_pro/mobile/pubspec.yaml
          printf 'dependency_overrides:\n  videl_pro_mobile:\n    path: ../videl_pro/mobile\n' > pubspec_overrides.yaml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Flutter version info
        working-directory: mobile
        run: flutter --version

      - name: Pub get
        working-directory: mobile
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: mobile
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        working-directory: mobile
        run: dart run flutter_native_splash:create

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/videl-release.jks
            echo "KEYSTORE_PATH=/tmp/videl-release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "Keystore decoded."
          else
            echo "No KEYSTORE_BASE64 secret — will fall back to debug signing."
          fi

      - name: Build release APK (arm64-v8a)
        working-directory: mobile
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK
        run: |
          mkdir -p out
          cp mobile/build/app/outputs/flutter-apk/app-release.apk out/videl-android-arm64-v8a.apk
          ls -lh out/

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_type == 'tag' && github.ref_name || 'android-latest' }}
          name: ${{ github.ref_type == 'tag' && format('Videl {0}', github.ref_name) || 'Videl Android (Latest)' }}
          body: |
            **Videl Android — arm64-v8a sideload build**

            Auto-built from `${{ github.ref_name }}` · commit `${{ github.sha }}`.

            ## Install
            1. Download `videl-android-arm64-v8a.apk` below
            2. On phone: Settings → Apps → Install unknown apps → allow your file manager / browser
            3. Open the APK → tap **Install**

            Requires Android 10+ (API 29). ARM64 only.
          # allowUpdates lets the action upsert the release if it already exists
          # (e.g. Windows/Linux built first on a shared v* tag).
          allowUpdates: true
          # NEVER replace existing artifacts — Windows/Linux files must survive.
          replacesArtifacts: false
          removeArtifacts: false
          # Only overwrite the body when this is a standalone android-* tag.
          # On shared v* tags the Windows build already set the body; skip it.
          omitBody: ${{ !startsWith(github.ref_name, 'android-') }}
          omitName: ${{ !startsWith(github.ref_name, 'android-') }}
          # Only a full v* release may be "latest": the desktop updater and the
          # site's download links read releases/latest. Phones find Android-only
          # releases through the release list (newestApk in update_checker.dart).
          makeLatest: ${{ startsWith(github.ref_name, 'v') && 'legacy' || 'false' }}
          artifacts: out/videl-android-arm64-v8a.apk
          token: ${{ secrets.GITHUB_TOKEN }}
